<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nexetaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#3730a3" stroke-width="8"/>
  
  <!-- Glowing Hex / Badge -->
  <path d="M 256 60 L 430 160 L 430 360 L 256 460 L 82 360 L 82 160 Z" 
        fill="none" stroke="url(#nexetaGrad)" stroke-width="6" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Stylized Nexeta "N" + Fuel Spout -->
  <path d="M 160 380 L 160 132 L 210 132 L 302 290 L 302 132 L 352 132 L 352 380 L 302 380 L 210 220 L 210 380 Z" 
        fill="url(#nexetaGrad)" filter="url(#glow)"/>

  <!-- Fuel Drop Accent -->
  <path d="M 390 170 C 390 150 410 120 410 120 C 410 120 430 150 430 170 C 430 185 420 195 410 195 C 400 195 390 185 390 170 Z" 
        fill="#06b6d4" filter="url(#glow)"/>
</svg>
